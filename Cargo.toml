[package]
name = "buaa"
version = "0.4.5"
edition = "2024"

[dependencies]
buaa_api = { git = "https://github.com/fontlos/buaa-api", rev = "c77f854"}
# buaa_api = { path = "../buaa-api" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tabled = "0.22.0"
textwrap = "0.16.4"
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
